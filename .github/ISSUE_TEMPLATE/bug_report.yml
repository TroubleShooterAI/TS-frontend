name: "🐛 Bug Report"
description: "버그나 예상치 못한 동작을 제보합니다."
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다! 명확한 해결을 위해 가능한 한 자세히 작성해주세요.

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 버그가 발생했는지 명확하게 설명해주세요.
      placeholder: "예: 로그아웃 버튼을 누르면 화면이 멈추는 현상이 있습니다."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해주세요.
      placeholder: |
        1. 메인 페이지로 이동합니다.
        2. 마이페이지 버튼을 클릭합니다.
        3. 로그아웃 버튼을 누릅니다.
        4. 화면이 반응하지 않습니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상했던 동작
      description: 원래 기대했던 정상적인 동작을 작성해주세요.
      placeholder: "예: 정상적으로 로그아웃 처리 후 로그인 페이지로 이동해야 합니다."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 / 영상 (선택)
      description: 관련 스크린샷이나 에러 콘솔 로그를 첨부해주세요.

  - type: dropdown
    id: environment
    attributes:
      label: 브라우저 및 환경 정보
      multiple: true
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Mobile (iOS)
        - Mobile (Android)